<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba del mapa de túneles</title>
<style>
body{margin:0;background:#050505;color:#d9d4c7;font-family:Georgia,"Times New Roman",serif;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:24px}
.mapa{width:min(420px,92vw)}
.mapa svg{width:100%;height:auto;display:block}
.panel{width:min(300px,92vw);display:flex;flex-direction:column;gap:10px;align-self:flex-start}
button{background:#14130f;color:#d9d4c7;border:1px solid #5b584e;padding:10px 12px;font:inherit;text-align:left;cursor:pointer}
button[aria-pressed="true"]{background:#2b2718;border-color:#ffe9b0}
button:focus-visible{outline:2px solid #ffe9b0;outline-offset:2px}
label{display:flex;gap:8px;align-items:center;margin-top:6px}
p{margin:0 0 6px;line-height:1.5}
</style></head><body>
<div class="mapa"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" class="envejecido" data-encendidos="" role="img" aria-label="Plano de la red de túneles bajo la facultad">
<title>Red de túneles bajo la facultad</title>
<!--
  CÓMO ENCENDER NODOS
  Basta con escribir los números en el atributo del <svg>, separados por espacios:
    <svg data-encendidos="1 3"> ... </svg>   (JS: svg.dataset.encendidos = "1 3")
  Nodos: 1 Química · 2 Física · 3 Edificio Central · 4 Hidráulica/Civil/Geofísica · 5 Entrada (Escuela/Pajarera)
  Estilo de plano antiguo: quitar la clase "envejecido" del <svg> lo desactiva.
  Nivel de oscuridad inicial: cambiar la variable CSS apagado (0 = invisible).
-->
<defs>
<filter id="envejecido" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="r"/>
<feDisplacementMap in="SourceGraphic" in2="r" scale="3" xChannelSelector="R" yChannelSelector="G" result="d"/>
<feGaussianBlur in="d" stdDeviation="1.1"/>
</filter>
</defs>
<style>
svg{--apagado:.05}
[data-nodo]{opacity:var(--apagado);transition:opacity 1.6s ease,filter 1.6s ease}
[data-nodo].i{opacity:0}
svg[data-encendidos~="1"] [data-nodo="1"]{opacity:1}
svg[data-encendidos~="1"] [data-nodo="1"].o,svg[data-encendidos~="1"] [data-nodo="1"].c{filter:drop-shadow(0 0 5px rgba(255,235,185,.55))}
svg[data-encendidos~="2"] [data-nodo="2"]{opacity:1}
svg[data-encendidos~="2"] [data-nodo="2"].o,svg[data-encendidos~="2"] [data-nodo="2"].c{filter:drop-shadow(0 0 5px rgba(255,235,185,.55))}
svg[data-encendidos~="3"] [data-nodo="3"]{opacity:1}
svg[data-encendidos~="3"] [data-nodo="3"].o,svg[data-encendidos~="3"] [data-nodo="3"].c{filter:drop-shadow(0 0 5px rgba(255,235,185,.55))}
svg[data-encendidos~="4"] [data-nodo="4"]{opacity:1}
svg[data-encendidos~="4"] [data-nodo="4"].o,svg[data-encendidos~="4"] [data-nodo="4"].c{filter:drop-shadow(0 0 5px rgba(255,235,185,.55))}
svg[data-encendidos~="5"] [data-nodo="5"]{opacity:1}
svg[data-encendidos~="5"] [data-nodo="5"].o,svg[data-encendidos~="5"] [data-nodo="5"].c{filter:drop-shadow(0 0 5px rgba(255,235,185,.55))}
/* Cuando los cinco nodos están encendidos, las líneas pasan a tonos verdes. */
svg[data-encendidos~="1"][data-encendidos~="2"][data-encendidos~="3"][data-encendidos~="4"][data-encendidos~="5"] #facultad{stroke:#a8f0b5}
svg[data-encendidos~="1"][data-encendidos~="2"][data-encendidos~="3"][data-encendidos~="4"][data-encendidos~="5"] #tuneles [stroke="#d9d4c7"]{stroke:#35e879!important}
svg.envejecido #facultad,svg.envejecido #tuneles{filter:url(#envejecido)}
#facultad{opacity:.55}
#luz-entrada{animation:pulso 2.6s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#luz-entrada{animation:none}[data-nodo]{transition:none}}
</style>

</div>
<div class="panel">
<p>Pulsa un nodo para encenderlo o apagarlo y probar cómo crece el mapa.</p>
<button data-n="1" aria-pressed="false">Nodo 1: Química</button>
<button data-n="2" aria-pressed="false">Nodo 2: Física</button>
<button data-n="3" aria-pressed="false">Nodo 3: Edificio Central</button>
<button data-n="4" aria-pressed="false">Nodo 4: Hidráulica, Civil y Geofísica</button>
<button data-n="5" aria-pressed="false">Nodo 5: Entrada (Pajarera)</button>
<button id="todos">Encender todo</button>
<button id="nada">Apagar todo</button>
<label><input type="checkbox" id="viejo" checked> Estilo de plano antiguo</label>
</div>
<script>
const svg=document.querySelector('.mapa svg'),on=new Set(),btns=[...document.querySelectorAll('button[data-n]')];
function pintar(){svg.dataset.encendidos=[...on].join(' ');btns.forEach(b=>b.setAttribute('aria-pressed',on.has(b.dataset.n)))}
btns.forEach(b=>b.onclick=()=>{on.has(b.dataset.n)?on.delete(b.dataset.n):on.add(b.dataset.n);pintar()});
todos.onclick=()=>{[1,2,3,4,5].forEach(n=>on.add(String(n)));pintar()};
nada.onclick=()=>{on.clear();pintar()};
viejo.onchange=()=>svg.classList.toggle('envejecido',viejo.checked);
</script></body></html>
